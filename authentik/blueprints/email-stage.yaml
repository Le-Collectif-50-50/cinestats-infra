# Blueprint Authentik — Stage Email (aucun n'existait sur l'instance).
# use_global_settings: true => réutilise AUTHENTIK_EMAIL__* (Brevo) injectées
# dans authentik-server/worker. Les autres champs (template, subject,
# token_expiry) restent aux valeurs par défaut : leur format change selon les
# versions (ex. token_expiry entier -> "minutes=30") et un format invalide fait
# échouer la validation du blueprint en silence.
version: 1
metadata:
  name: cinestats-email-stage
entries:
  - model: authentik_stages_email.emailstage
    id: stage-email-default
    identifiers:
      name: default-email-stage
    attrs:
      name: default-email-stage
      use_global_settings: true
