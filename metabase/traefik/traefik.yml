api:
  dashboard: false

ping:
  entryPoint: web

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: web

certificatesResolvers:
  letsencrypt:
    acme:
      # Traefik ne substitue PAS les variables d'env dans ce fichier statique :
      # email en clair (contact Let's Encrypt, non secret).
      email: admin@cinestats5050.fr
      storage: /acme.json
      httpChallenge:
        entryPoint: web
