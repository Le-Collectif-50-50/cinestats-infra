services:
  traefik:
    image: traefik:v3.7.8
    container_name: metabase-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
    environment:
      # Docker Engine 29.x impose une API >= 1.40 (le client Traefik retomberait
      # sinon sur 1.24). Pin explicite dans la plage supportée.
      - DOCKER_API_VERSION=1.44
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  metabase:
    image: metabase/metabase:v0.53.8
    container_name: metabase
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=${MB_DB_NAME}
      - MB_DB_PORT=5432
      - MB_DB_USER=${MB_DB_USER}
      - MB_DB_PASS=${MB_DB_PASSWORD}
      - MB_DB_HOST=metabase-db
      - MB_SITE_URL=https://${METABASE_DOMAIN}
      - MB_EMBEDDING_SECRET_KEY=${MB_EMBEDDING_SECRET_KEY}
      - JAVA_OPTS=-Xmx512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`${METABASE_DOMAIN}`)"
      - "traefik.http.routers.metabase.entrypoints=websecure"
      - "traefik.http.routers.metabase.tls.certresolver=letsencrypt"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 1280m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web
      - metabase-internal

  metabase-db:
    image: postgres:16-alpine
    container_name: metabase-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${MB_DB_USER}
      - POSTGRES_PASSWORD=${MB_DB_PASSWORD}
      - POSTGRES_DB=${MB_DB_NAME}
    # Publié en loopback uniquement (jamais public) pour que postgres-exporter
    # (réseau host) puisse s'y connecter via 127.0.0.1.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - metabase-internal

  # --- Monitoring : exporters en réseau host pour que UFW gouverne les ports
  # (Docker contournerait UFW sur des ports publiés). Scrapés par le Prometheus
  # du VPS Services (UFW restreint 9100/9187 à son IP).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres-exporter
    restart: unless-stopped
    network_mode: host
    environment:
      - DATA_SOURCE_NAME=postgresql://${MB_DB_USER}:${MB_DB_PASSWORD}@127.0.0.1:5432/${MB_DB_NAME}?sslmode=disable
    depends_on:
      metabase-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  metabase-db-data:

networks:
  web:
    driver: bridge
  metabase-internal:
    internal: true
