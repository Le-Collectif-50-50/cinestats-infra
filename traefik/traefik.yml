api:
  dashboard: false

ping:
  entryPoint: web

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: web

certificatesResolvers:
  letsencrypt:
    acme:
      # Traefik ne substitue PAS les variables d'env dans ce fichier statique :
      # l'email doit être écrit en clair (ce n'est pas un secret, juste le contact
      # Let's Encrypt). Pour le changer, éditer cette ligne.
      email: admin@cinestats5050.fr
      storage: /acme.json
      httpChallenge:
        entryPoint: web
