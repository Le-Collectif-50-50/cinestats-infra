services:
  traefik:
    image: traefik:v3.4
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./acme.json:/acme.json
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      # Docker Engine 29.x impose une API >= 1.40 ; sans ce pin, le client Docker
      # de Traefik retombe sur 1.24 (« client version 1.24 is too old ») et le
      # provider Docker ne démarre pas (pas de routage, pas d'ACME).
      - DOCKER_API_VERSION=1.44
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true
