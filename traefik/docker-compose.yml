services:
  traefik:
    image: traefik:v3.7.8
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./acme.json:/acme.json
    environment:
      # Docker Engine 29.x impose une API >= 1.40. Le client Docker de Traefik
      # (v3.7+) négocie correctement ; ce pin explicite reste un filet de sécurité
      # (1.44 est dans la plage supportée par le daemon 1.40–1.55).
      - DOCKER_API_VERSION=1.44
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true
