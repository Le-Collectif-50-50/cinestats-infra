global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          vps: services

  # VPS Metabase — exporters en réseau host, joignables par IP publique
  # (UFW du VPS Metabase restreint 9100/9187 à l'IP de ce VPS Services).
  # Cibles générées en CI depuis vars.VPS_METABASE_HOST (pas d'IP dans le repo).
  - job_name: "node-exporter-metabase"
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node-exporter-metabase.yml"]

  - job_name: "postgres-exporter-metabase"
    file_sd_configs:
      - files: ["/etc/prometheus/targets/postgres-exporter-metabase.yml"]

  # VPS de prod CineStats (app, db, data) — node-exporter installé par
  # infra/vps/55-exporters.sh du repo CineStats, 9100 ouvert à l'IP de ce VPS
  # Services seulement. Cibles générées en CI depuis vars.VPS_PROD_*_HOST.
  - job_name: "node-exporter-prod"
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node-exporter-prod.yml"]

  # Désactivé tant que la BDD prod (VPS-2) n'est pas provisionnée
  # (le service postgres-exporter est commenté dans docker-compose.yml).
  # - job_name: "postgres-exporter"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # - job_name: "cinestats-backend"
  #   static_configs:
  #     - targets: ["backend:8000"]
  #   metrics_path: /metrics
