global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          vps: services

  # VPS Metabase — exporters en réseau host, joignables par IP publique
  # (UFW du VPS Metabase restreint 9100/9187 à l'IP de ce VPS Services).
  - job_name: "node-exporter-metabase"
    static_configs:
      - targets: ["193.70.43.234:9100"]
        labels:
          vps: metabase

  - job_name: "postgres-exporter-metabase"
    static_configs:
      - targets: ["193.70.43.234:9187"]
        labels:
          vps: metabase

  # Désactivé tant que la BDD prod (VPS-2) n'est pas provisionnée
  # (le service postgres-exporter est commenté dans docker-compose.yml).
  # - job_name: "postgres-exporter"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # - job_name: "cinestats-backend"
  #   static_configs:
  #     - targets: ["backend:8000"]
  #   metrics_path: /metrics
