global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Désactivé tant que la BDD prod (VPS-2) n'est pas provisionnée
  # (le service postgres-exporter est commenté dans docker-compose.yml).
