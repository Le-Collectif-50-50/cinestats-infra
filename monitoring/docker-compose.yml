services:
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring-internal
      # web = bridge avec egress : nécessaire pour scraper les exporters d'autres
      # VPS par IP publique (monitoring-internal est internal:true, sans sortie).
      - web

  grafana:
    image: grafana/grafana:12.0.1
    container_name: grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN}
      # SSO OIDC via Authentik (le login admin local reste dispo en secours)
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${AUTHENTIK_GRAFANA_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${AUTHENTIK_GRAFANA_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.cinestats5050.fr/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.cinestats5050.fr/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.cinestats5050.fr/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'Grafana Admins') && 'Admin' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=false
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web
      - monitoring-internal

  bugsink:
    image: bugsink/bugsink:2.5.0
    container_name: bugsink
    restart: unless-stopped
    depends_on:
      bugsink-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${BUGSINK_DB_USER}:${BUGSINK_DB_PASSWORD}@bugsink-db:5432/${BUGSINK_DB_NAME}
      - SECRET_KEY=${BUGSINK_SECRET_KEY}
      - PORT=8000
      - BASE_URL=https://${BUGSINK_DOMAIN}
      - BEHIND_HTTPS_PROXY=True
      - CREATE_SUPERUSER=${BUGSINK_SUPERUSER_EMAIL}:${BUGSINK_SUPERUSER_PASSWORD}
    healthcheck:
      # curl/wget absents de l'image, et Traefik EXCLUT les conteneurs unhealthy :
      # simple check TCP (python3, présent) que gunicorn écoute bien sur :8000.
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost',8000),5).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bugsink.rule=Host(`${BUGSINK_DOMAIN}`)"
      - "traefik.http.routers.bugsink.entrypoints=websecure"
      - "traefik.http.routers.bugsink.tls.certresolver=letsencrypt"
      - "traefik.http.services.bugsink.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web
      - monitoring-internal

  bugsink-db:
    image: postgres:16-alpine
    container_name: bugsink-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${BUGSINK_DB_USER}
      - POSTGRES_PASSWORD=${BUGSINK_DB_PASSWORD}
      - POSTGRES_DB=${BUGSINK_DB_NAME}
    volumes:
      - bugsink-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BUGSINK_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring-internal

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring-internal

  # Désactivé tant que la BDD prod (VPS-2) n'est pas provisionnée — sinon crash-loop
  # et cible "down" dans Prometheus. Réactiver avec POSTGRES_EXPORTER_DSN + le job
  # correspondant dans prometheus/prometheus.yml une fois la BDD prod en place.
  # postgres-exporter:
  #   image: prometheuscommunity/postgres-exporter:v0.17.1
  #   container_name: postgres-exporter
  #   restart: unless-stopped
  #   environment:
  #     - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DSN}
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 64m
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"
  #   networks:
  #     - monitoring-internal

volumes:
  prometheus-data:
  grafana-data:
  bugsink-db-data:

networks:
  web:
    external: true
  monitoring-internal:
    internal: true
