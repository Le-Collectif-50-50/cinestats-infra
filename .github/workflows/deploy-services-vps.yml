name: Deploy Services VPS

# Déploie Traefik (reverse proxy partagé), la stack monitoring
# (Prometheus + Grafana + Bugsink + node-exporter), Vaultwarden et Authentik (SSO)
# sur le VPS-1 Services. Les .env sont générés sur le runner à partir des
# secrets/variables GitHub, puis synchronisés sur le VPS ; aucun secret dans le repo.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "traefik/**"
      - "monitoring/**"
      - "vaultwarden/**"
      - "authentik/**"
      - ".github/workflows/deploy-services-vps.yml"

concurrency: deploy-services-vps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          echo "${{ vars.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Generate .env files
        run: |
          # Traefik n'a plus besoin de .env (email en dur dans traefik.yml,
          # DOCKER_SOCK a une valeur par défaut dans le compose).
          cat > monitoring/.env <<'EOF'
          GRAFANA_DOMAIN=${{ vars.GRAFANA_DOMAIN }}
          GRAFANA_ADMIN_USER=${{ vars.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          BUGSINK_DOMAIN=${{ vars.BUGSINK_DOMAIN }}
          BUGSINK_SECRET_KEY=${{ secrets.BUGSINK_SECRET_KEY }}
          BUGSINK_DB_USER=${{ vars.BUGSINK_DB_USER }}
          BUGSINK_DB_PASSWORD=${{ secrets.BUGSINK_DB_PASSWORD }}
          BUGSINK_DB_NAME=${{ vars.BUGSINK_DB_NAME }}
          BUGSINK_SUPERUSER_EMAIL=${{ vars.BUGSINK_SUPERUSER_EMAIL }}
          BUGSINK_SUPERUSER_PASSWORD=${{ secrets.BUGSINK_SUPERUSER_PASSWORD }}
          AUTHENTIK_GRAFANA_CLIENT_ID=${{ vars.AUTHENTIK_GRAFANA_CLIENT_ID }}
          AUTHENTIK_GRAFANA_CLIENT_SECRET=${{ secrets.AUTHENTIK_GRAFANA_CLIENT_SECRET }}
          SMTP_HOST=${{ vars.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT }}
          SMTP_USERNAME=${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ vars.SMTP_FROM }}
          EOF
          # Cibles Prometheus du VPS Metabase (file_sd), IP hors repo
          mkdir -p monitoring/prometheus/targets
          cat > monitoring/prometheus/targets/node-exporter-metabase.yml <<'EOF'
          - targets: ["${{ vars.VPS_METABASE_HOST }}:9100"]
            labels:
              vps: metabase
          EOF
          cat > monitoring/prometheus/targets/postgres-exporter-metabase.yml <<'EOF'
          - targets: ["${{ vars.VPS_METABASE_HOST }}:9187"]
            labels:
              vps: metabase
          EOF
          # Cibles Prometheus des 3 VPS de prod CineStats (app, db, data)
          cat > monitoring/prometheus/targets/node-exporter-prod.yml <<'EOF'
          - targets: ["${{ vars.VPS_PROD_APP_HOST }}:9100"]
            labels:
              vps: prod-app
          - targets: ["${{ vars.VPS_PROD_DB_HOST }}:9100"]
            labels:
              vps: prod-db
          - targets: ["${{ vars.VPS_PROD_DATA_HOST }}:9100"]
            labels:
              vps: prod-data
          EOF
          cat > vaultwarden/.env <<'EOF'
          VAULTWARDEN_DOMAIN=${{ vars.VAULTWARDEN_DOMAIN }}
          VAULTWARDEN_ADMIN_TOKEN=${{ secrets.VAULTWARDEN_ADMIN_TOKEN }}
          VAULTWARDEN_SIGNUPS_ALLOWED=${{ vars.VAULTWARDEN_SIGNUPS_ALLOWED }}
          SMTP_HOST=${{ vars.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT }}
          SMTP_SECURITY=${{ vars.SMTP_SECURITY }}
          SMTP_FROM=${{ vars.SMTP_FROM }}
          SMTP_USERNAME=${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          AUTHENTIK_VW_CLIENT_ID=${{ vars.AUTHENTIK_VW_CLIENT_ID }}
          AUTHENTIK_VW_CLIENT_SECRET=${{ secrets.AUTHENTIK_VW_CLIENT_SECRET }}
          EOF
          cat > authentik/.env <<'EOF'
          AUTHENTIK_DOMAIN=${{ vars.AUTHENTIK_DOMAIN }}
          AUTHENTIK_SECRET_KEY=${{ secrets.AUTHENTIK_SECRET_KEY }}
          AUTHENTIK_DB_USER=${{ vars.AUTHENTIK_DB_USER }}
          AUTHENTIK_DB_PASSWORD=${{ secrets.AUTHENTIK_DB_PASSWORD }}
          AUTHENTIK_DB_NAME=${{ vars.AUTHENTIK_DB_NAME }}
          AUTHENTIK_BOOTSTRAP_EMAIL=${{ vars.AUTHENTIK_BOOTSTRAP_EMAIL }}
          AUTHENTIK_BOOTSTRAP_PASSWORD=${{ secrets.AUTHENTIK_BOOTSTRAP_PASSWORD }}
          AUTHENTIK_EMAIL__HOST=${{ vars.SMTP_HOST }}
          AUTHENTIK_EMAIL__PORT=${{ vars.SMTP_PORT }}
          AUTHENTIK_EMAIL__USERNAME=${{ vars.SMTP_USERNAME }}
          AUTHENTIK_EMAIL__PASSWORD=${{ secrets.SMTP_PASSWORD }}
          AUTHENTIK_EMAIL__USE_TLS=true
          AUTHENTIK_EMAIL__USE_SSL=false
          AUTHENTIK_EMAIL__FROM=CineStats <${{ vars.SMTP_FROM }}>
          AUTHENTIK_GRAFANA_CLIENT_ID=${{ vars.AUTHENTIK_GRAFANA_CLIENT_ID }}
          AUTHENTIK_GRAFANA_CLIENT_SECRET=${{ secrets.AUTHENTIK_GRAFANA_CLIENT_SECRET }}
          AUTHENTIK_VW_CLIENT_ID=${{ vars.AUTHENTIK_VW_CLIENT_ID }}
          AUTHENTIK_VW_CLIENT_SECRET=${{ secrets.AUTHENTIK_VW_CLIENT_SECRET }}
          EOF

      - name: Sync files to VPS
        env:
          SSH: ssh -i ~/.ssh/id_ci -p ${{ vars.VPS_SSH_PORT }}
          DEST: ${{ vars.VPS_SSH_USER }}@${{ vars.VPS_HOST }}
        run: |
          $SSH "$DEST" 'mkdir -p ~/cinestats-infra/traefik ~/cinestats-infra/monitoring ~/cinestats-infra/vaultwarden ~/cinestats-infra/authentik'
          # acme.json exclu : jamais écrasé/supprimé par --delete (préserve les certs)
          rsync -az --delete --exclude '.git' --exclude 'acme.json' -e "$SSH" \
            traefik/ "$DEST:~/cinestats-infra/traefik/"
          rsync -az --delete --exclude '.git' -e "$SSH" \
            monitoring/ "$DEST:~/cinestats-infra/monitoring/"
          rsync -az --delete --exclude '.git' -e "$SSH" \
            vaultwarden/ "$DEST:~/cinestats-infra/vaultwarden/"
          rsync -az --delete --exclude '.git' -e "$SSH" \
            authentik/ "$DEST:~/cinestats-infra/authentik/"

      - name: Deploy on VPS
        env:
          SSH: ssh -i ~/.ssh/id_ci -p ${{ vars.VPS_SSH_PORT }}
          DEST: ${{ vars.VPS_SSH_USER }}@${{ vars.VPS_HOST }}
        run: |
          $SSH "$DEST" 'bash -s' <<'EOF'
          set -euo pipefail
          docker network inspect web >/dev/null 2>&1 || docker network create web
          cd ~/cinestats-infra/traefik
          [ -f acme.json ] || { touch acme.json && chmod 600 acme.json; }
          docker compose -f docker-compose.yml up -d   # -f = ignore l'override dev
          cd ~/cinestats-infra/monitoring
          docker compose up -d
          cd ~/cinestats-infra/vaultwarden
          docker compose up -d
          cd ~/cinestats-infra/authentik
          docker compose up -d
          docker compose ps
          EOF
